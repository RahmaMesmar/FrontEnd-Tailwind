<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!----google font montserrat--->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!--google font Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link href="./src/output.css" rel="stylesheet">
    <title>Glow Store</title>
</head>
<body class="bg-[#FCF9F8] ">
    <section class="grid grid-cols-2">
        <div class="py-45 px-24">
            <h2 class="font-PlayfairDisplay text-muted text-center">Glow Store</h2>  
            <h1 class="font-PlayfairDisplay mt-12 text-center text-6xl font-normal">Welcome Back</h1>
            <h4 class="font-DMSanse text-[#524345] text-center pt-4">Sign in to continue your Glow Store experience</h4>
            <div class="pt-8">
                <h5 class="text-[#524345] font-DMSanse ml-4">Email Address</h5>
                <div class="w-full px-5">

    <input
        type="email"
        placeholder="your@email.com"
        class="w-full border-b-2 border-pink-200 py-2 outline-none"
    >

    <div class="flex justify-between mt-6">
        <label>Password</label>
        <a href="#" class="text-[#994d5b]">Forgot Password?</a>
    </div>

    <input
        type="password"
        placeholder="••••••••"
        class="w-full border-b-2 border-pink-200 py-2 outline-none"
    >

    <div class="flex items-center gap-2 mt-7">
        <input type="checkbox">
        <label>Remember me</label>
    </div>

    <button
        class="w-full bg-[#994d5b] text-white py-4 rounded-xl mt-7"
    >
        Sign In
    </button>

    <div class="flex items-center gap-2 my-10">
        <div class="border-t flex-1"></div>
        <span>Or continue with</span>
        <div class="border-t flex-1"></div>
    </div>

    <div class="grid grid-cols-2 gap-4">

        <button class="border border-pink-200 py-4 rounded-xl">
           <img src="./assets/icons/google.svg"/ class="mx-auto"> 
        </button>

        <button class="border border-pink-200 py-4 rounded-xl">
            <img src="./assets/icons/Apple.svg"/ class="mx-auto">
        </button>

    </div>

    <p class="text-center mt-9">
        Don't have an account?
        <a href="#" class="text-[#994d5b]">
            Create Account
        </a>
    </p>

</div>
            </div>
        </div>
        <div>
        <img src="./assets/login page/login.png" class="w-full h-full"/>
        </div>
    </section>
</body>
</html>
